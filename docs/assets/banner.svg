<svg width="920" height="260" viewBox="0 0 920 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="neatify — tidy your folders, safely">
  <style>
    text { font-family: ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono','JetBrains Mono','Cascadia Code', ui-monospace, Consolas, monospace; }

    /* the emerald node breathes */
    .node { transform-box: fill-box; transform-origin: center; animation: breathe 3.6s ease-in-out infinite; }
    .nodeHalo { transform-box: fill-box; transform-origin: center; animation: halo 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @keyframes halo { 0%,100% { transform: scale(1); opacity: .18; } 50% { transform: scale(1.5); opacity: .05; } }

    /* the "sorted stack": three bars, always visible, gently re-aligning in a wave */
    .bar { transform-box: fill-box; transform-origin: left center; }
    .bar1 { animation: nudge 4.6s ease-in-out infinite; }
    .bar2 { animation: nudge 4.6s ease-in-out .18s infinite; }
    .bar3 { animation: nudge 4.6s ease-in-out .36s infinite; }
    @keyframes nudge {
      0%, 100% { transform: scaleX(1);   opacity: 1; }
      42%      { transform: scaleX(.78); opacity: .6; }
      58%      { transform: scaleX(1.04);opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ink-black ground -->
  <rect width="920" height="260" rx="16" fill="#0A0B0D"/>
  <rect x="0.5" y="0.5" width="919" height="259" rx="15.5" fill="none" stroke="#1C1F24"/>

  <!-- faint emerald ambient, low and off to one side -->
  <ellipse cx="340" cy="150" rx="420" ry="180" fill="url(#glow)"/>

  <!-- ===================== WORDMARK (vectorized Century Gothic Bold) ===================== -->
  <!-- neat (ink) + ify (emerald). Native glyph box: x 0..424, baseline 0, caps up to -99, descender +26. -->
  <g transform="translate(96,150)">
    <path fill="#F4F6F5" d="M8.9 -70.1H26.4V-63Q32.4 -68 37.3 -70Q42.2 -71.9 47.2 -71.9Q57.7 -71.9 65 -64.6Q71.1 -58.5 71.1 -46.3V0H53.7V-30.7Q53.7 -43.3 52.6 -47.4Q51.4 -51.6 48.6 -53.7Q45.8 -55.9 41.7 -55.9Q36.4 -55.9 32.5 -52.3Q28.7 -48.7 27.2 -42.4Q26.4 -39.1 26.4 -28.2V0H8.9Z M156.8 -30H100.3Q101.5 -22.5 106.8 -18.1Q112.1 -13.7 120.4 -13.7Q130.2 -13.7 137.3 -20.6L152.1 -13.6Q146.6 -5.7 138.9 -2Q131.1 1.8 120.5 1.8Q104 1.8 93.6 -8.6Q83.2 -19 83.2 -34.7Q83.2 -50.7 93.6 -61.3Q103.9 -71.9 119.5 -71.9Q136.1 -71.9 146.5 -61.3Q156.8 -50.7 156.8 -33.3ZM139.1 -43.8Q137.4 -49.7 132.3 -53.4Q127.1 -57 120.4 -57Q113 -57 107.5 -52.9Q104 -50.3 101 -43.8Z M221.3 -70.1H238.8V0H221.3V-7.4Q216.1 -2.5 210.9 -0.4Q205.7 1.8 199.7 1.8Q186.1 1.8 176.1 -8.7Q166.2 -19.3 166.2 -34.9Q166.2 -51.2 175.8 -61.6Q185.4 -71.9 199.2 -71.9Q205.5 -71.9 211 -69.5Q216.6 -67.2 221.3 -62.4ZM202.8 -55.7Q194.6 -55.7 189.2 -49.9Q183.7 -44.2 183.7 -35.1Q183.7 -26 189.3 -20.2Q194.8 -14.3 202.8 -14.3Q211.1 -14.3 216.6 -20.1Q222.1 -25.8 222.1 -35.2Q222.1 -44.3 216.6 -50Q211.1 -55.7 202.8 -55.7Z M257.1 -96H274.7V-70.1H285.1V-55H274.7V0H257.1V-55H248.1V-70.1H257.1Z"/>
    <path fill="#4ADE80" d="M299.9 -99Q304.5 -99 307.8 -95.6Q311.2 -92.3 311.2 -87.5Q311.2 -82.8 307.9 -79.5Q304.6 -76.2 300 -76.2Q295.3 -76.2 292 -79.6Q288.7 -83 288.7 -87.8Q288.7 -92.4 292 -95.7Q295.2 -99 299.9 -99ZM291.1 -70.1H308.7V0H291.1Z M314.7 -70.1H320.9Q321 -83.9 321.4 -86.4Q322.1 -92.2 326.2 -95.6Q330.4 -99 338 -99Q343.5 -99 350.4 -96.5V-83.1Q346.6 -84.2 344.1 -84.2Q341 -84.2 339.6 -82.9Q338.6 -81.9 338.6 -78.9L338.5 -70.1H349.7V-55.2H338.5V0H320.9V-55.2H314.7Z M350.6 -70.1H368.6L386.8 -26.1L406.9 -70.1H425L381 25.7H362.8L377.3 -5.2Z"/>
  </g>

  <!-- emerald node + halo, riding just after the wordmark -->
  <g transform="translate(548,120)">
    <circle class="nodeHalo" r="15" fill="#4ADE80" opacity="0.18"/>
    <circle class="node" r="7.5" fill="#4ADE80"/>
  </g>

  <!-- the "sorted stack" glyph: three bars, top one emerald -->
  <g transform="translate(584,104)">
    <rect class="bar bar1" x="0" y="0"  width="42" height="6" rx="3" fill="#4ADE80"/>
    <rect class="bar bar2" x="0" y="14" width="30" height="6" rx="3" fill="#3A3D42"/>
    <rect class="bar bar3" x="0" y="28" width="36" height="6" rx="3" fill="#3A3D42"/>
  </g>

  <!-- supporting copy, quiet -->
  <text x="98" y="196" font-size="19" font-weight="500" fill="#C7CDD2" letter-spacing="0.2">Tidy your folders, safely.</text>
  <text class="mono" x="98" y="222" font-size="13.5" fill="#8A9199" letter-spacing="0.2">A small Java CLI that sorts files into folders by extension — dry-run by default.</text>

  <!-- minimal meta strip, right-aligned, unobtrusive -->
  <g class="mono" text-anchor="end" font-size="12" letter-spacing="0.4">
    <text x="824" y="150" fill="#8A9199">v1.0.1</text>
    <text x="824" y="170" fill="#565C63">Java 21+ · MIT</text>
  </g>
  <line x1="824" y1="120" x2="824" y2="180" stroke="#1C1F24"/>
  <circle cx="856" cy="146" r="3" fill="#4ADE80"/>
</svg>
