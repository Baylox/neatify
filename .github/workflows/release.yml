name: Release

# Build the jar and publish a GitHub Release whenever a v* tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the runnable jar
        run: ./mvnw -B -ntp package

      - name: Stage the release artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp target/neatify.jar "neatify-${version}.jar"
          sha256sum "neatify-${version}.jar" > "neatify-${version}.jar.sha256"

      # Build an "Install" section with the tag's version baked into the commands.
      # It is placed before the auto-generated changelog (generate_release_notes).
      # The heredoc body is intentionally NOT indented so the Markdown is not
      # treated as an indented code block.
      - name: Build release notes header
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          {
            printf '%s\n\n' "Neatify is a small Java CLI that tidies a folder by moving files into category folders (Documents, Images, Videos…) based on their extension. It defaults to a safe dry-run preview."
            printf '## Install\n\n'
            printf '%s\n\n' "Requires a **JDK 21+** — the jar is self-contained, no install step."
            printf '```bash\n'
            printf '# Download\n'
            printf 'curl -LO %s/neatify-%s.jar\n\n' "$base" "$version"
            printf '# Optional: verify the checksum\n'
            printf 'curl -LO %s/neatify-%s.jar.sha256\n' "$base" "$version"
            printf 'sha256sum -c neatify-%s.jar.sha256\n\n' "$version"
            printf '# Run\n'
            printf 'java -jar neatify-%s.jar                                          # interactive menu\n' "$version"
            printf 'java -jar neatify-%s.jar --source ~/Downloads --use-default-rules # preview (dry-run)\n' "$version"
            printf '```\n\n'
            printf 'See the [README](https://github.com/%s#readme) and [docs](https://github.com/%s/blob/master/docs/index.md) for usage, and the [API docs](https://baylox.github.io/neatify/).\n\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY"
            printf -- '---\n'
          } > release-notes-header.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body_path: release-notes-header.md
          files: |
            neatify-*.jar
            neatify-*.jar.sha256
