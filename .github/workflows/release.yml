name: Release

# Build the jar and publish a GitHub Release whenever a v* tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the runnable jar
        run: ./mvnw -B -ntp package

      - name: Stage the release artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp target/neatify.jar "neatify-${version}.jar"
          sha256sum "neatify-${version}.jar" > "neatify-${version}.jar.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          generate_release_notes: true
          files: |
            neatify-*.jar
            neatify-*.jar.sha256
