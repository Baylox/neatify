version: 2
updates:
  # Maven dependencies and plugins declared in pom.xml.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Roll minor + patch bumps into one PR; majors stay separate for review.
      maven-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows (keeps SHA pins + version comments fresh).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
